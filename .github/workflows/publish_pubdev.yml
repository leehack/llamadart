name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  publish-companion:
    name: Publish companion (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: llamadart_llama_cpp_flutter
            path: packages/llamadart_llama_cpp_flutter
          - name: llamadart_litert_lm_flutter
            path: packages/llamadart_litert_lm_flutter
    steps:
      - uses: actions/checkout@v6

      - name: Decide whether to publish
        id: publish
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          set -euo pipefail
          package_version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' "$PACKAGE_PATH/pubspec.yaml")"
          if [ -z "$package_version" ]; then
            echo "$PACKAGE_PATH/pubspec.yaml does not contain a version" >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          status="$(
            curl -sS -o "$RUNNER_TEMP/pubdev-version.json" -w '%{http_code}' \
              "https://pub.dev/api/packages/$PACKAGE_NAME/versions/$package_version"
          )"
          case "$status" in
            200)
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_NAME $package_version already exists on pub.dev; skipping companion publish."
              ;;
            404)
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_NAME $package_version is not on pub.dev; publishing."
              ;;
            *)
              echo "Unexpected pub.dev response for $PACKAGE_NAME $package_version: HTTP $status" >&2
              cat "$RUNNER_TEMP/pubdev-version.json" >&2 || true
              exit 1
              ;;
          esac

      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
        if: steps.publish.outputs.should_publish == 'true'

      - uses: flutter-actions/setup-flutter@d4e97a6e7467ef062618c9af927f90bc9651b876
        if: steps.publish.outputs.should_publish == 'true'

      - name: Prepare package
        if: steps.publish.outputs.should_publish == 'true'
        run: |
          rm -rf "$RUNNER_TEMP/pub-package"
          mkdir -p "$RUNNER_TEMP/pub-package"
          rsync -a --delete \
            --exclude='.dart_tool' \
            --exclude='build' \
            --exclude='pubspec.lock' \
            "${{ matrix.package.path }}/" "$RUNNER_TEMP/pub-package/"

      - name: Install dependencies
        if: steps.publish.outputs.should_publish == 'true'
        run: dart pub get
        working-directory: ${{ runner.temp }}/pub-package

      - name: Publish - dry run
        if: steps.publish.outputs.should_publish == 'true'
        run: dart pub publish --dry-run
        working-directory: ${{ runner.temp }}/pub-package

      - name: Publish to pub.dev
        if: steps.publish.outputs.should_publish == 'true'
        run: dart pub publish -f
        working-directory: ${{ runner.temp }}/pub-package
