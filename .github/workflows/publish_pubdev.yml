name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  publish-llama-cpp-flutter:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c

      - uses: flutter-actions/setup-flutter@d4e97a6e7467ef062618c9af927f90bc9651b876

      - name: Prepare package
        run: |
          rm -rf "$RUNNER_TEMP/pub-package"
          mkdir -p "$RUNNER_TEMP/pub-package"
          rsync -a --delete \
            --exclude='.dart_tool' \
            --exclude='build' \
            --exclude='pubspec.lock' \
            packages/llamadart_llama_cpp_flutter/ "$RUNNER_TEMP/pub-package/"

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ runner.temp }}/pub-package

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ runner.temp }}/pub-package

      - name: Publish to pub.dev
        run: dart pub publish -f
        working-directory: ${{ runner.temp }}/pub-package

  publish-litert-lm-flutter:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c

      - uses: flutter-actions/setup-flutter@d4e97a6e7467ef062618c9af927f90bc9651b876

      - name: Prepare package
        run: |
          rm -rf "$RUNNER_TEMP/pub-package"
          mkdir -p "$RUNNER_TEMP/pub-package"
          rsync -a --delete \
            --exclude='.dart_tool' \
            --exclude='build' \
            --exclude='pubspec.lock' \
            packages/llamadart_litert_lm_flutter/ "$RUNNER_TEMP/pub-package/"

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ runner.temp }}/pub-package

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ runner.temp }}/pub-package

      - name: Publish to pub.dev
        run: dart pub publish -f
        working-directory: ${{ runner.temp }}/pub-package
