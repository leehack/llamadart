name: High-Risk Regression Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: high-risk-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: Exact-head adversarial evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve current base and changed files
        id: state
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_BASE_REF"
          current_base_sha="$(git rev-parse FETCH_HEAD)"
          checked_out_head_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_head_sha" != "$PR_HEAD_SHA" ]]; then
            echo "Checked-out head does not match the pull request head." >&2
            exit 1
          fi
          git diff --name-only "$current_base_sha...$checked_out_head_sha" \
            > "$RUNNER_TEMP/high-risk-changed-files.txt"
          read -r behind ahead < <(
            git rev-list --left-right --count \
              "$current_base_sha...$checked_out_head_sha"
          )
          {
            echo "base_sha=$current_base_sha"
            echo "head_sha=$checked_out_head_sha"
            echo "behind=$behind"
            echo "ahead=$ahead"
            echo "changed_files=$RUNNER_TEMP/high-risk-changed-files.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Query unresolved review threads
        id: threads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GRAPHQL_QUERY: >-
            query($owner:String!, $name:String!, $number:Int!) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  reviewThreads(first:100) {
                    nodes { isResolved }
                    pageInfo { hasNextPage }
                  }
                }
              }
            }
          THREADS_JQ: >-
            if .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage
            then error("more than 100 review threads; audit pagination")
            else [.data.repository.pullRequest.reviewThreads.nodes[] |
            select(.isResolved == false)] | length end
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          unresolved="$(
            gh api graphql \
              -f owner="$owner" \
              -f name="$name" \
              -F number="$PR_NUMBER" \
              -f query="$GRAPHQL_QUERY" \
              --jq "$THREADS_JQ"
          )"
          echo "count=$unresolved" >> "$GITHUB_OUTPUT"

      - name: Enforce exact-head high-risk evidence
        env:
          EVENT_PATH: ${{ github.event_path }}
          CHANGED_FILES: ${{ steps.state.outputs.changed_files }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          HEAD_SHA: ${{ steps.state.outputs.head_sha }}
          BEHIND: ${{ steps.state.outputs.behind }}
          AHEAD: ${{ steps.state.outputs.ahead }}
          UNRESOLVED_THREADS: ${{ steps.threads.outputs.count }}
        run: |
          dart run tool/testing/check_high_risk_pr_contract.dart \
            --event "$EVENT_PATH" \
            --changed-files "$CHANGED_FILES" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --behind "$BEHIND" \
            --ahead "$AHEAD" \
            --unresolved-threads "$UNRESOLVED_THREADS"
