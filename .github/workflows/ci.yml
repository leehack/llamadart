name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: dart run tool/prepare_workspace.dart

      # A tracked lockfile pub rewrites on every resolve is a real defect, and
      # nothing else in CI would notice it.
      - name: Verify dependency preparation leaves tracked files unchanged
        run: git diff --exit-code

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze

      - name: Check platform boundaries
        run: dart run tool/testing/check_platform_boundaries.dart

      - name: Verify release docs versions
        run: dart run tool/testing/verify_release_docs_versions.dart

      - name: Check WebGPU bridge asset tag
        run: dart run tool/testing/check_webgpu_bridge_tag.dart

      - name: Pub Publish Dry Run
        run: flutter pub publish --dry-run

      - name: Install Pana
        run: flutter pub global activate pana

      # pana fails when (max - granted) > threshold. Its max is 160, so the
      # old value of 160 could never trip. Package scores 160/160; 0 keeps it
      # there, and a tolerance of 5+ would hide a whole scoring bucket.
      - name: Check Pana Score
        run: flutter pub global run pana . --exit-code-threshold 0

  companion-packages:
    name: Companion Package (${{ matrix.package }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/llamadart_llama_cpp_flutter
          - packages/llamadart_litert_lm_flutter
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Check formatting
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ matrix.package }}
        run: flutter test

      - name: Validate SwiftPM manifest
        working-directory: ${{ matrix.package }}
        run: |
          package_name="$(basename "$PWD")"
          swift package --package-path "darwin/$package_name" dump-package >/dev/null

      - name: Publish dry-run
        working-directory: ${{ matrix.package }}
        run: |
          tmp_package="$RUNNER_TEMP/$(basename "$PWD")-publish"
          rm -rf "$tmp_package"
          mkdir -p "$tmp_package"
          rsync -a --delete \
            --exclude='.dart_tool' \
            --exclude='build' \
            --exclude='pubspec.lock' \
            ./ "$tmp_package/"
          (cd "$tmp_package" && flutter pub publish --dry-run)

  docs-check:
    name: Docs Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: (cd website && npm ci)

      - name: Test documentation tooling
        run: (cd website && npm test)

      - name: Build documentation site
        run: ./tool/docs/build_site.sh

  test-linux-coverage:
    name: Test Linux VM (with Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Coverage tool
        run: dart pub global activate coverage

      - name: Cache tiny GGUF test model
        id: tiny-gguf-cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/test_models/stories15M.gguf
          key: tiny-gguf-stories15M-${{ runner.os }}-v1

      - name: Download tiny GGUF test model
        if: steps.tiny-gguf-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p .dart_tool/test_models
          curl_args=(--fail --location --retry 8 --retry-all-errors --retry-delay 10)
          if [[ -n "${HF_TOKEN:-}" ]]; then
            curl_args+=(--header "Authorization: Bearer $HF_TOKEN")
          fi
          curl "${curl_args[@]}" \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M.gguf" \
            --output .dart_tool/test_models/stories15M.gguf

      - name: Cache llama.cpp chat templates
        id: llama-cpp-templates-cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/llama_cpp_templates
          key: llama-cpp-templates-${{ hashFiles('tool/testing/llama_cpp_templates.ref') }}

      - name: Download llama.cpp chat templates
        if: steps.llama-cpp-templates-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ref="$(tr -d '[:space:]' < tool/testing/llama_cpp_templates.ref)"
          mkdir -p .dart_tool/llama_cpp_templates
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
            "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$ref.tar.gz" \
            | tar -xz -C .dart_tool/llama_cpp_templates --strip-components=3 \
              "llama.cpp-$ref/models/templates"

      - name: Run VM tests (with coverage)
        env:
          LLAMADART_TEST_MODELS_DIR: ${{ github.workspace }}/.dart_tool/test_models
          LLAMA_CPP_TEMPLATES_DIR: ${{ github.workspace }}/.dart_tool/llama_cpp_templates
          REQUIRE_LLAMA_CPP_TEMPLATES: '1'
        run: dart test -p vm -j 1 --exclude-tags local-only --coverage=coverage

      - name: Format coverage
        run: |
          dart pub global run coverage:format_coverage --lcov --in=coverage/test --out=coverage/lcov.info --report-on=lib --check-ignore
          dart run tool/testing/check_lcov_threshold.dart coverage/lcov.info 70

      - name: Import Codecov uploader verification key
        run: |
          curl --fail --location --silent --show-error \
            https://uploader.codecov.io/verification.gpg \
            --output codecov-verification.gpg
          gpg --batch --import codecov-verification.gpg
          gpg --batch --fingerprint 806BB28AED779869 \
            | grep -q "2703 4E7F DB85 0E0B BC2C  62FF 806B B28A ED77 9869"

      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test-web:
    name: Test Web (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Browser tests
        run: dart test -p chrome --exclude-tags local-only

  web-chat-contract:
    name: Web Chat Contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example/chat_app && flutter pub get)

      - name: Run chat app tests
        working-directory: example/chat_app
        run: |
          flutter test
          flutter test --platform chrome test/chat_generation_service_test.dart

      - name: Build and validate deployable Web artifact
        env:
          CHAT_APP_BASE_HREF: /example/chat_app/build/web/
          CHAT_APP_BUILD_SHA: ${{ github.sha }}
        run: ./scripts/build_chat_app_web.sh

      - name: Cache tiny GGUF browser model
        id: web-tiny-gguf-cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/test_models/stories15M.gguf
          key: tiny-gguf-stories15M-${{ runner.os }}-v1

      - name: Download tiny GGUF browser model
        if: steps.web-tiny-gguf-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p .dart_tool/test_models
          curl_args=(--fail --location --retry 8 --retry-all-errors --retry-delay 10)
          if [[ -n "${HF_TOKEN:-}" ]]; then
            curl_args+=(--header "Authorization: Bearer $HF_TOKEN")
          fi
          curl "${curl_args[@]}" \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M.gguf" \
            --output .dart_tool/test_models/stories15M.gguf

      - name: Install Playwright Chromium
        run: |
          python -m venv .dart_tool/playwright-python
          .dart_tool/playwright-python/bin/pip install "playwright==1.61.0"
          .dart_tool/playwright-python/bin/python -m playwright install --with-deps chromium

      - name: Run deterministic Web chat smoke
        run: |
          dart run tool/testing/run_local_e2e.dart \
            --scenario chat-app-web-mock-smoke \
            --skip-build

      - name: Run real worker and GGUF browser smoke
        run: |
          dart run tool/testing/run_local_e2e.dart \
            --scenario chat-app-web-real-model-smoke \
            --skip-build \
            --model-url \
            "http://127.0.0.1:7358/.dart_tool/test_models/stories15M.gguf" \
            --allow-any-response

      - name: Upload Web contract diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: web-chat-contract-diagnostics
          path: |
            example/chat_app/build/web/llamadart-build.json
            example/chat_app/build/web/webgpu_bridge/manifest.json
            example/chat_app/build/web/webgpu_bridge/sha256sums.txt
          if-no-files-found: ignore

  test-linux-web:
    name: Test Linux & Web (with Coverage)
    runs-on: ubuntu-latest
    needs:
      - test-linux-coverage
      - test-web
      - web-chat-contract
    steps:
      - name: Confirm Linux coverage and Web tests passed
        run: echo "Linux VM coverage and Chrome tests passed."

  test-other-os:
    name: Test Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache tiny GGUF test model
        id: tiny-gguf-cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/test_models/stories15M.gguf
          key: tiny-gguf-stories15M-${{ runner.os }}-v1

      - name: Download tiny GGUF test model
        if: steps.tiny-gguf-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p .dart_tool/test_models
          curl_args=(--fail --location --retry 8 --retry-all-errors --retry-delay 10)
          if [[ -n "${HF_TOKEN:-}" ]]; then
            curl_args+=(--header "Authorization: Bearer $HF_TOKEN")
          fi
          curl "${curl_args[@]}" \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M.gguf" \
            --output .dart_tool/test_models/stories15M.gguf

      - name: Run native tests
        env:
          GGML_METAL_DEVICES: "0"
          LLAMADART_TEST_MODELS_DIR: ${{ github.workspace }}/.dart_tool/test_models
        run: dart test -p vm -j 1 --exclude-tags local-only

  native-prompt-reuse-parity:
    name: Native Prompt Reuse Parity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download parity model
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl_args=(--fail --location --retry 8 --retry-all-errors --retry-delay 10)
          if [[ -n "${HF_TOKEN:-}" ]]; then
            curl_args+=(--header "Authorization: Bearer $HF_TOKEN")
          fi
          curl "${curl_args[@]}" \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true" \
            --output "$RUNNER_TEMP/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

      - name: Run native prompt reuse parity
        run: |
          dart run tool/testing/native_prompt_reuse_parity.dart \
            --model "$RUNNER_TEMP/models/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
            --prompt-file "tool/testing/prompts/native_prompt_reuse_ci_prompts.txt" \
            --max-prompts 4 \
            --runs 1 \
            --max-tokens 64 \
            --gpu-layers 0 \
            --threads 1 \
            --threads-batch 1 \
            --temp 0 \
            --top-k 1 \
            --top-p 1.0 \
            --min-p 0.0 \
            --repeat-penalty 1.0 \
            --fail-on-mismatch
