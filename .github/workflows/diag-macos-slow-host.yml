name: DIAG macOS slow host
on:
  push:
    branches: [ci/macos-slow-host-diag]
concurrency:
  group: diag-macos-slow-host-${{ github.sha }}
jobs:
  arms:
    name: arms (replica ${{ matrix.replica }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Cache tiny GGUF test model
        id: tiny-gguf-cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/test_models/stories15M.gguf
          key: tiny-gguf-stories15M-${{ runner.os }}-v1
      - name: Download tiny GGUF test model
        if: steps.tiny-gguf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .dart_tool/test_models
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M.gguf" \
            --output .dart_tool/test_models/stories15M.gguf
      - name: Host
        timeout-minutes: 3
        shell: bash
        run: |
          sysctl hw.ncpu hw.physicalcpu hw.logicalcpu hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu hw.memsize machdep.cpu.brand_string kern.hv_vmm_present || true
          system_profiler SPHardwareDataType SPDisplaysDataType | sed -n 1,40p || true
          uptime
          for n in 1 3 4 6; do
            start=$(python3 -c 'import time;print(time.time())')
            for i in $(seq $n); do python3 -c 'x=0
          for i in range(20000000): x+=i' & done
            wait
            echo "DIAG_CPUBENCH procs=$n wall_s=$(python3 -c "import time;print(round(time.time()-$start,2))")"
          done
      - name: Arms
        shell: bash
        env:
          LLAMADART_TEST_MODELS_DIR: ${{ github.workspace }}/.dart_tool/test_models
          SUITES: test/integration/backends/llama_cpp/prompt_state_isolation_test.dart test/integration/next_token_scoring_test.dart
        run: |
          run_arm() {
            local name="$1"; shift
            local start=$(date +%s)
            ( env "$@" dart test -p vm -j 1 --exclude-tags local-only $SUITES > "arm_$name.log" 2>&1 ) &
            local pid=$!
            sleep 25
            top -l 2 -s 3 -n 4 -stats pid,cpu,th,command | tail -7 > "top_$name.txt" 2>&1 || true
            if [ "${SAMPLED:-}" != "1" ] && [ "$name" = "t0_metal0_a" ]; then
              for p in $(pgrep -f 'dart' ); do sample "$p" 4 -mayDie -file "sample_$p.txt" > /dev/null 2>&1 || true; done
            fi
            wait $pid; local rc=$?
            echo "DIAG_ARM name=$name secs=$(( $(date +%s) - start )) rc=$rc $(tail -1 arm_$name.log | cut -c1-60)"
            cat "top_$name.txt"
          }
          run_arm t0_metal0_a GGML_METAL_DEVICES=0
          run_arm t2_metal0_a GGML_METAL_DEVICES=0 DIAG_THREADS=2
          run_arm t1_metal0   GGML_METAL_DEVICES=0 DIAG_THREADS=1
          run_arm t3_metal0   GGML_METAL_DEVICES=0 DIAG_THREADS=3
          run_arm t4_metal0   GGML_METAL_DEVICES=0 DIAG_THREADS=4
          run_arm t0_metalon  DIAG_NONE=1
          run_arm t2_metalon  DIAG_THREADS=2
          run_arm t0_metal0_b GGML_METAL_DEVICES=0
          run_arm t2_metal0_b GGML_METAL_DEVICES=0 DIAG_THREADS=2
          for f in sample_*.txt; do echo "--- $f"; grep -E "Thread_|ggml_|llama_|Physical footprint|MTL|Metal" "$f" | head -60 | cut -c1-130; done
          grep -h "ggml_metal\|GPU name\|MTL" arm_t0_metalon.log | head -10 || true
