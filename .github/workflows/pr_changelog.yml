name: PR changelog

on:
  pull_request:
    branches: [main, 'release/[0-9]+.[0-9]+.x']
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  push:
    branches: [main, 'release/[0-9]+.[0-9]+.x']
  # The docs version cut pushes to main using GITHUB_TOKEN.
  workflow_run:
    workflows: [Docs Version Cut]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-changelog-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_name) || 'main' }}
  cancel-in-progress: false

jobs:
  changelog:
    name: PR changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - run: dart tool/release/pr_changelog.dart --event

  backport:
    name: Backport
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.base.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - run: dart pub get
      - run: dart tool/release/patch_branch.dart backport-guard --event
        env:
          GH_TOKEN: ${{ github.token }}

  open-preps:
    name: Find open core release preps
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      numbers: ${{ steps.list.outputs.numbers }}
      base-ref: ${{ steps.list.outputs.base_ref }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          base_ref=main
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            base_ref="$GITHUB_REF_NAME"
          fi
          numbers="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?base=$base_ref&state=open&per_page=100" |
            jq -c --arg repo "$GITHUB_REPOSITORY" '
              [.[][] | select(.head.repo.full_name == $repo)
              | select(.head.ref | startswith("release/genkit_llamadart-") | not)
              | select(any(.labels[]; .name == "release-prep") or
                       (.head.ref | test("^release/(prep-[0-9]+\\.[0-9]+\\.[0-9]+([-+][A-Za-z0-9._-]+)?|[0-9]+\\.[0-9]+\\.[0-9]+([-+][A-Za-z0-9._-]+)?-prep)$")))
              | .number]')"
          {
            echo "numbers=$numbers"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

  release-prep:
    name: Verify release prep${{ matrix.number != 0 && format(' (#{0})', matrix.number) || '' }}
    needs: [changelog, open-preps]
    # Keep checking the protected changelogs after a prep loses its label.
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' &&
       (github.event.label.name == 'release-prep' ||
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name != 'pull_request' &&
       needs.open-preps.outputs.numbers != '[]' &&
       needs.open-preps.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.open-preps.outputs.numbers || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base-advance events run open PR code in the target branch cache scope.
    cache-mode: none
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require PR changelog validation to pass
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
        shell: bash
        run: |
          if [[ "$CHANGELOG_RESULT" != success ]]; then
            echo 'PR changelog validation did not pass. See the PR changelog job.' >&2
            exit 1
          fi
      - name: Read current release prep PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.number }}
          BASE_REF: ${{ needs.open-preps.outputs.base-ref }}
        shell: bash
        run: |
          snapshot="$RUNNER_TEMP/release-prep-event.json"
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq .object.sha)"
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --argjson number "$PR_NUMBER" --arg ref "$BASE_REF" --arg tip "$tip" '
              select(.number == $number and .state == "open" and
                     .head.repo.full_name == $repo and .base.repo.full_name == $repo and .base.ref == $ref and
                     (.head.sha | test("^[0-9a-f]{40}$")) and (.base.sha | test("^[0-9a-f]{40}$")) and
                     .base.sha == $tip)
              | {pull_request: .}' > "$snapshot"; then
            echo "Could not read open PR #$PR_NUMBER against current $BASE_REF $tip." >&2
            exit 1
          fi
          echo "PR_EVENT_PATH=$snapshot" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.number != 0 && format('refs/pull/{0}/merge', matrix.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - name: Check the real PR head and tested merge result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot="${PR_EVENT_PATH:-$GITHUB_EVENT_PATH}"
          base="$(jq -r .pull_request.base.sha "$snapshot")"
          base_ref="$(jq -r .pull_request.base.ref "$snapshot")"
          head="$(jq -r .pull_request.head.sha "$snapshot")"
          if [[ "$(git show -s --format=%P HEAD)" != "$base $head" ]]; then
            echo "Tested merge must have the PR base and head as parents." >&2
            exit 1
          fi
          echo "Verifying PR head $head against $base_ref $base."
          if [[ -n "${PR_EVENT_PATH:-}" ]]; then
            body_check="$RUNNER_TEMP/pr_changelog.dart"
            git show "$base:tool/release/pr_changelog.dart" > "$body_check"
            GITHUB_EVENT_PATH="$snapshot" dart "$body_check" --event
          fi
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$snapshot" GITHUB_SHA="$(git rev-parse HEAD)" \
            dart tool/testing/check_released_changelog_sections.dart > "$RUNNER_TEMP/changelog-policy.txt"
          cat "$RUNNER_TEMP/changelog-policy.txt"
          if grep -Fxq 'Core release prep: true' "$RUNNER_TEMP/changelog-policy.txt"; then
            # The final squash can preserve whitespace by appending attribution.
            message="$RUNNER_TEMP/release-prep-message.md"
            tree="$(git rev-parse 'HEAD^{tree}')"
            signoff='Signed-off-by: Release prep CI <release-prep@users.noreply.github.com>'
            coauthor=$'---------\n\nCo-authored-by: Release prep CI <release-prep@users.noreply.github.com>'
            dart pub get
            verify_squash() {
              local squash
              squash="$(git -c user.name='Release prep CI' -c user.email='release-prep@users.noreply.github.com' \
                commit-tree "$tree" -p "$base" -F "$message")" || return 1
              git checkout --detach "$squash" || return 1
              git show -s --format=%B "$squash" > "$message" || return 1
              bash tool/release/verify_release_candidate.sh "$base" "$squash" "$message" "$base_ref"
            }
            for variant in coauthor signoff combined plain; do
              case "$variant" in
                coauthor) attribution="$coauthor"; description='with co-author trailer' ;;
                signoff) attribution="$signoff"; description='with sign-off trailer' ;;
                combined) attribution="$coauthor"$'\n'"$signoff"; description='with co-author and sign-off trailers' ;;
                plain) attribution=''; description='without trailers' ;;
              esac
              jq -r '.pull_request | "\(.title) (#\(.number))\n\n\(.body)"' "$snapshot" > "$message"
              if [[ -n "$attribution" ]]; then
                printf '\n%s\n' "$attribution" >> "$message"
              fi
              if ! verify_squash; then
                echo "Squash variant $description failed." >&2
                echo 'If the receipt is malformed, edit the PR body. End the receipt block with no trailing attribution or whitespace.' >&2
                exit 1
              fi
            done
            number="$(jq -r .pull_request.number "$snapshot")"
            # GraphQL expands the query variables.
            # shellcheck disable=SC2016
            gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
              -F number="$number" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    viewerMergeHeadlineText(mergeType: SQUASH)
                    viewerMergeBodyText(mergeType: SQUASH)
                  }
                }
              }' | jq -e -r --arg suffix " (#$number)" '
              .data.repository.pullRequest
              | select((.viewerMergeHeadlineText | type) == "string" and
                       (.viewerMergeBodyText | type) == "string" and
                       (.viewerMergeHeadlineText | endswith($suffix)))
              | "\(.viewerMergeHeadlineText)\n\n\(.viewerMergeBodyText)"' > "$message"
            if ! verify_squash; then
              echo "GitHub's default squash message fails verification. Edit the PR body until the rewrapped message parses." >&2
              exit 1
            fi
          fi
