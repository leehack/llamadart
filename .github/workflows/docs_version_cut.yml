name: Docs Version Cut

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cut-version:
    name: Cut docs version from release tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: 'stable'
          cache: true

      - name: Install website dependencies
        run: (cd website && dart pub get)

      - name: Cut and commit versioned docs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Target docs version: ${VERSION}"

          git fetch --no-tags origin refs/heads/main
          worktree="$(mktemp -d)"
          git worktree add --detach "$worktree" FETCH_HEAD
          trap 'git worktree remove --force "$worktree"' EXIT

          # Read the tagged docs and stage the snapshot against current main.
          (cd website && dart run tool/cut_version.dart "$VERSION" "$worktree/website")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd "$worktree"
          git add website/versions.json website/versioned_docs website/versioned_sidebars
          if git diff --cached --quiet; then
            echo "Nothing to push."
            exit 0
          fi
          git commit -m "docs: cut version ${VERSION}"
          git push origin HEAD:main
