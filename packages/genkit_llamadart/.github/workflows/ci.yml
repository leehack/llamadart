name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Only obsolete PR runs share a group; every main push keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B -m unittest discover -s .github -p "test_*.py"
          python3 .github/select_ci.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve latest compatible dependencies
        run: flutter pub upgrade

      - name: Install pana
        run: flutter pub global activate pana

      - name: Cache real-model test artifacts
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/cache@v5
        with:
          path: .dart_tool/llamadart_test_models
          key: ${{ runner.os }}-llamadart-test-models-${{ hashFiles('test/integration/genkit/test_support/real_model_test_support.dart') }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze

      - name: Verify pana score
        run: flutter pub global run pana . --exit-code-threshold 0

      - name: Verify documentation links
        run: python3 .github/check_docs.py

      - name: Verify documentation snippets
        if: steps.changes.outputs.runtime != 'true'
        run: dart test test/tooling/package_documentation_test.dart

      - name: Run tests
        if: steps.changes.outputs.runtime == 'true'
        run: dart test -x real-model

      - name: Verify browser capability guards
        if: steps.changes.outputs.runtime == 'true'
        run: >-
          dart test -p chrome
          test/api/runtime_owner/browser_guard_test.dart
          test/integration/genkit/plugin/bidi_browser_guard_test.dart
          test/integration/genkit/plugin/reasoning_history_test.dart
          test/integration/genkit/converters/constrained_value_validation_test.dart
          test/integration/genkit/media/browser_guards_test.dart
          test/integration/genkit/plugin/runtime_capabilities_test.dart
          test/integration/genkit/actions/model_action/inference_controls_test.dart
          test/api/generation_config/inference_controls_codec_test.dart
          test/integration/genkit/actions/scoring_action_test.dart
          test/core/runtime/llama_engine_runtime_test.dart
          test/integration/genkit/actions/embedder_action/multimodal_embedding_test.dart
          test/integration/genkit/actions/embedder_action/multimodal_cancellation_test.dart
          test/integration/genkit/converters/genkit_to_llama/rich_tool_schemas_test.dart
          test/integration/genkit/actions/model_action/rich_tool_schemas_test.dart
          test/integration/genkit/plugin/rich_tool_schema_loop_test.dart

      - name: Run real-model tests
        if: steps.changes.outputs.runtime == 'true'
        env:
          LLAMADART_AUTO_DOWNLOAD_TEST_MODELS: '1'
        run: dart test -t real-model -j 1

      - name: Verify publish readiness
        run: flutter pub publish --dry-run

  dependency-compatibility:
    name: Dependency compatibility (lower bounds)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/select_ci.py

      - name: Set up minimum Dart SDK
        if: steps.changes.outputs.runtime == 'true'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0

      - name: Resolve lower-bound runtime dependencies
        if: steps.changes.outputs.runtime == 'true'
        run: dart pub add crypto@3.0.7 genkit@1.0.0 llamadart@0.15.0 schemantic@1.0.0

      - name: Analyze package
        if: steps.changes.outputs.runtime == 'true'
        run: dart analyze

      - name: Run fast tests
        if: steps.changes.outputs.runtime == 'true'
        run: dart test -x real-model
