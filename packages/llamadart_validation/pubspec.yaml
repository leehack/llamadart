name: llamadart_validation
description: Private cross-platform validation harness for the public llamadart API.
publish_to: none
environment:
  sdk: ^3.10.7
dependencies:
  llamadart:
    path: ../..
  crypto: ^3.0.0
  ffi: ^2.1.0
  http: ^1.1.0
  path: ^1.8.3
dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.3
flutter:
  assets:
    - assets/profiles/
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes:
        runtimes: [llama_cpp, litert_lm]
        platforms:
          ios-x86_64-sim: [llama_cpp]
          windows-arm64: [llama_cpp]
