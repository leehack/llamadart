name: llamadart_stable_diffusion_flutter
description: Flutter Apple SwiftPM runtime companion package for llamadart stable-diffusion.cpp image generation.
version: 0.0.1
repository: https://github.com/leehack/llamadart/tree/main/packages/llamadart_stable_diffusion_flutter
homepage: https://github.com/leehack/llamadart
issue_tracker: https://github.com/leehack/llamadart/issues

topics:
  - stable-diffusion
  - image-generation
  - flutter

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LlamadartStableDiffusionPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LlamadartStableDiffusionPlugin
        sharedDarwinSource: true
