name: llamadart_basic_example
description: A basic example of using llamadart package
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.7

dependencies:
  llamadart:
    path: ../..  # Use local version for testing
  args: ^2.4.2
  sqlite3: ^3.1.6
  sqlite_vector: ^0.9.85

dev_dependencies:
  ffi: ^2.1.0
  lints: ^6.1.0
  test: ^1.26.3

hooks:
  user_defines:
    llamadart:
      # The image example needs the opt-in stable_diffusion runtime. Every
      # example here loads GGUF, so this list also leaves out litert_lm; an
      # app that keeps the default runtimes sets
      # `llamadart_extra_runtimes: [stable_diffusion]` instead.
      llamadart_native_runtimes: [llama_cpp, stable_diffusion]
