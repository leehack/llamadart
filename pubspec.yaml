name: llamadart
description: Dart and Flutter local LLM inference with llama.cpp GGUF and LiteRT-LM across native platforms and web.
version: 0.8.20
homepage: https://github.com/leehack/llamadart
repository: https://github.com/leehack/llamadart
issue_tracker: https://github.com/leehack/llamadart/issues
topics:
  - llama
  - llm
  - inference
  - gguf
  - litert

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.7

dependencies:
  archive: ^4.0.7
  ffi: ^2.1.0
  path: ^1.8.3
  http: ^1.1.0
  crypto: ^3.0.0
  web: ^1.0.0
  code_assets: '>=1.0.0 <3.0.0'
  hooks: '>=1.0.0 <3.0.0'
  logging: ^1.3.0
  # jinja_analyzer.dart imports dinja's private src/lexer.dart, src/parser.dart
  # and src/ast/nodes.dart. This bound only rules out a silently resolved 1.1.x;
  # a 1.0.x patch can move those files just as freely, and consumers of released
  # versions resolve dinja themselves. jinja_analyzer_dinja_coupling_test.dart
  # catches the break in CI. Durable fix: dinja exports this surface -
  # issue #351 option 2. Re-verify the imports to widen.
  dinja: '>=1.0.0 <1.1.0'

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.26.3
