name: llamadart
description: Cross-platform, on-device LLM inference for Dart and Flutter. Run GGUF (llama.cpp) and LiteRT-LM models locally on Android, iOS, macOS, Windows, Linux and web.
version: 0.8.24
homepage: https://llamadart.leehack.com
repository: https://github.com/leehack/llamadart
issue_tracker: https://github.com/leehack/llamadart/issues
topics:
  - llm
  - ai
  - on-device
  - offline
  - gguf

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.7

dependencies:
  archive: ^4.0.7
  ffi: ^2.1.0
  path: ^1.8.3
  http: ^1.1.0
  crypto: ^3.0.0
  web: ^1.0.0
  code_assets: '>=1.0.0 <3.0.0'
  hooks: '>=1.0.0 <3.0.0'
  logging: ^1.3.0
  yaml: ^3.1.3
  dinja: ^1.1.0

dev_dependencies:
  coverage: 1.15.1
  ffigen: ">=21.0.0 <23.0.0"
  lints: ^6.1.0
  test: ^1.26.3
